plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace = 'com.olimposystems.android'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.olimposystems.android"
        minSdk = 23
        targetSdk = 36
        versionCode = 12
        versionName = "2.0"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    // Assinatura do release para o Google Play: tools/android-release.sh lê release.env e
    // exporta estas variáveis. Sem elas (CI, máquina de dev) o release sai sem assinatura.
    def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        if (keystore) {
            release {
                storeFile = file(keystore)
                storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (keystore) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    testOptions {
        // Robolectric needs the merged resources to render screens in screenshot tests.
        unitTests.includeAndroidResources = true
        // Robolectric loads its native graphics runtime; allow it without JDK warnings.
        unitTests.all { jvmArgs '--enable-native-access=ALL-UNNAMED' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    // Screenshot tests (JVM, no device): ./gradlew :app:recordRoborazziDebug
    testImplementation platform('androidx.compose:compose-bom:2026.09.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.18'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.79.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.79.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
